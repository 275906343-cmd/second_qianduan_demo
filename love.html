<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致我最爱的你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 50%, #f5e6ff 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 粒子背景容器 */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            color: #ff6b9d;
            font-size: 20px;
            animation: fall linear infinite;
            opacity: 0.6;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* 标题 */
        .title {
            font-size: clamp(28px, 5vw, 48px);
            color: #d63384;
            text-align: center;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInDown 1s ease-out 0.5s forwards;
            text-shadow: 2px 2px 4px rgba(214, 51, 132, 0.2);
            font-weight: bold;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 爱心容器 */
        .heart-container {
            position: relative;
            width: clamp(180px, 35vw, 280px);
            height: clamp(180px, 35vw, 280px);
            margin-bottom: 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
            overflow: visible;
        }

        .heart-container:hover {
            transform: scale(1.1);
        }

        .heart-container:active {
            animation: heartBurst 0.6s ease-out;
        }

        @keyframes heartBurst {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* 爱心图形 */
        .heart {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: heartbeat 1.5s ease-in-out infinite;
            overflow: visible;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 52%;
            height: 85%;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4778 50%, #d63384 100%);
            border-radius: 50% 50% 0 0;
            box-shadow: 0 0 30px rgba(255, 107, 157, 0.6),
                        0 0 60px rgba(255, 71, 120, 0.4),
                        inset 0 -10px 20px rgba(214, 51, 132, 0.3);
        }

        .heart::before {
            left: 50%;
            top: 0;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            top: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.15);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.1);
            }
        }

        /* 爱心光晕效果 */
        .heart-glow {
            position: absolute;
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(255, 107, 157, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.1);
            }
        }

        /* 表白文字区域 */
        .love-letter {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: clamp(20px, 3vw, 30px);
            max-width: 550px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(214, 51, 132, 0.15),
                        0 0 0 1px rgba(255, 107, 157, 0.1);
            opacity: 0;
            animation: fadeInUp 1s ease-out 1s forwards;
            position: relative;
            overflow: hidden;
        }

        .love-letter::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b9d, #d63384, #9c52b9, #ff6b9d);
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .letter-content {
            font-size: clamp(13px, 2vw, 14px);
            line-height: 1.6;
            color: #5a4a5a;
            text-align: justify;
        }

        .letter-content p {
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .letter-content p:nth-child(1) { animation-delay: 1.5s; }
        .letter-content p:nth-child(2) { animation-delay: 2s; }
        .letter-content p:nth-child(3) { animation-delay: 2.5s; }
        .letter-content p:nth-child(4) { animation-delay: 3s; }
        .letter-content p:nth-child(5) { animation-delay: 3.5s; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .highlight {
            color: #d63384;
            font-weight: bold;
        }

        /* 签名区域 */
        .signature {
            text-align: right;
            margin-top: 25px;
            font-style: italic;
            color: #9c52b9;
            font-size: clamp(12px, 2vw, 14px);
            opacity: 0;
            animation: fadeIn 0.8s ease-out 4s forwards;
        }

        /* 音乐控制按钮 */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.2);
            z-index: 100;
            transition: all 0.3s ease;
            border: 2px solid #ff6b9d;
        }

        .music-control:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(214, 51, 132, 0.3);
        }

        .music-control.playing {
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .music-icon {
            font-size: 24px;
        }

        /* 点击惊喜效果容器 */
        .surprise-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .surprise-heart {
            position: absolute;
            font-size: 30px;
            animation: floatUp 2s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) scale(0.5);
            }
        }

        /* 底部提示 */
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #9c52b9;
            font-size: 14px;
            opacity: 0.7;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .main-container {
                padding: 30px 15px;
            }

            .love-letter {
                padding: 20px;
            }

            .music-control {
                width: 45px;
                height: 45px;
                top: 15px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            .title {
                margin-bottom: 30px;
            }

            .heart-container {
                margin-bottom: 40px;
            }

            .love-letter {
                padding: 15px;
            }

            .letter-content {
                line-height: 1.8;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #ffeef8;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff6b9d, #d63384);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #d63384, #9c52b9);
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <div class="particles-container" id="particles"></div>

    <!-- 惊喜效果容器 -->
    <div class="surprise-container" id="surprise"></div>

    <!-- 音乐控制 -->
    <div class="music-control" id="musicControl" title="点击播放/暂停音乐">
        <span class="music-icon">🎵</span>
    </div>

    <!-- 背景音乐 -->
    <!-- 使用说明：请将光良《窗外》的MP3文件放在与此HTML文件同级目录，命名为"chuangwai.mp3" -->
    <audio id="bgMusic" loop preload="auto">
        <source src="chuangwai.mp3" type="audio/mpeg">
    </audio>

    <!-- 主内容 -->
    <div class="main-container">
        <h1 class="title">致我最爱的你</h1>

        <div class="heart-container" id="heartContainer">
            <div class="heart-glow"></div>
            <div class="heart"></div>
        </div>

        <div class="love-letter">
            <div class="letter-content">
                <p>亲爱的，</p>
                <p>从遇见你的那一刻起，我的世界变得<span class="highlight">五彩斑斓</span>。你的笑容是我每天最期待的风景，你的声音是我心中最美的旋律。</p>
                <p>我想成为那个<span class="highlight">为你遮风挡雨</span>的人，想在你开心时陪你一起笑，在你难过时给你最温暖的拥抱。</p>
                <p>每一天醒来，想到你，心里就充满了<span class="highlight">甜蜜和力量</span>。你是我生命中最美好的礼物，是我想要用一生去珍惜的人。</p>
                <p>今天，我想大声告诉你：<span class="highlight">我爱你</span>，不是说说而已，而是想用一辈子的时间去证明。</p>
            </div>
            <div class="signature">
                永远爱你的我<br>
                <span id="currentDate"></span>
            </div>
        </div>
    </div>

    <div class="hint">💕 点击爱心有惊喜哦 💕</div>

    <script>
        // 创建飘落粒子
        function createParticles() {
            const container = document.getElementById('particles');
            const hearts = ['💕', '💖', '💗', '💝', '💘', '✨', '🌸'];
            
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.fontSize = (Math.random() * 15 + 15) + 'px';
                container.appendChild(particle);
            }
        }

        // 点击爱心惊喜效果
        function createSurpriseHearts(e) {
            const container = document.getElementById('surprise');
            const hearts = ['💕', '💖', '💗', '💝', '💘', '❤️', '💓'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'surprise-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = (e.clientX + (Math.random() - 0.5) * 100) + 'px';
                heart.style.top = (e.clientY + (Math.random() - 0.5) * 50) + 'px';
                heart.style.animationDelay = Math.random() * 0.5 + 's';
                container.appendChild(heart);
                
                setTimeout(() => heart.remove(), 2500);
            }
        }

        // 音乐控制
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const control = document.getElementById('musicControl');
            
            if (music.paused) {
                music.play().then(() => {
                    control.classList.add('playing');
                    control.querySelector('.music-icon').textContent = '🎶';
                }).catch((error) => {
                    console.log('播放失败，请检查音频文件是否存在:', error);
                    alert('请先将光良《窗外》的MP3文件命名为"chuangwai.mp3"并放在与此页面同级目录');
                });
            } else {
                music.pause();
                control.classList.remove('playing');
                control.querySelector('.music-icon').textContent = '🎵';
            }
        }

        // 显示当前日期
        function showCurrentDate() {
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            document.getElementById('currentDate').textContent = `${year}年${month}月${day}日`;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            showCurrentDate();

            // 爱心点击事件
            document.getElementById('heartContainer').addEventListener('click', createSurpriseHearts);

            // 音乐控制
            document.getElementById('musicControl').addEventListener('click', toggleMusic);

            // 尝试自动播放音乐
            setTimeout(() => {
                const music = document.getElementById('bgMusic');
                const control = document.getElementById('musicControl');
                music.volume = 0.5;
                music.play().then(() => {
                    control.classList.add('playing');
                    control.querySelector('.music-icon').textContent = '🎶';
                }).catch(() => {
                    // 自动播放被阻止，等待用户点击音乐按钮
                });
            }, 1000);
        });

        // 平滑滚动效果
        document.addEventListener('wheel', (e) => {
            if (e.deltaY > 0) {
                window.scrollBy({
                    top: 100,
                    behavior: 'smooth'
                });
            } else {
                window.scrollBy({
                    top: -100,
                    behavior: 'smooth'
                });
            }
        });
    </script>
</body>
</html>
